[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velora-bff-service"
version = "0.1.0"
description = "Velora TPRM Backend-for-Frontend Service"
requires-python = ">=3.12"
dependencies = [
    "velora-common",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.27,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "pydantic[email]>=2.6,<3.0",
    "pydantic-settings>=2.1,<3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
