[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velora-reporting-service"
version = "0.1.0"
description = "Velora TPRM Reporting Service"
requires-python = ">=3.12"
dependencies = [
    "velora-common",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "redis>=5.0,<6.0",
    "weasyprint>=69.0,<70.0",
    "python-pptx>=1.0,<2.0",
    "matplotlib>=3.9,<4.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
