[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velora-workflow-service"
version = "0.1.0"
description = "Velora TPRM Workflow Service (Temporal workers)"
requires-python = ">=3.12"
dependencies = [
    "velora-common",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
