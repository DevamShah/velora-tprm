[project]
name = "velora-tprm"
version = "2.0.0"
description = "Third-Party Risk Management platform"
requires-python = ">=3.12"

# ── Ruff ──────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 79
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PLW",  # pylint warnings
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed Any
    # UP042 rewrites `class X(str, Enum)` to `class X(StrEnum)`. That is a
    # behaviour change, not a modernisation: str(X.A) yields "X.A" under
    # (str, Enum) but "a" under StrEnum. These enums cross the API and
    # persistence boundary, so the rewrite is deliberately not taken.
    # (str, Enum) remains fully supported on 3.12.
    "UP042",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom deliberately evaluates these in
# argument defaults; the returned objects are inert markers, not shared
# mutable state, so B008 does not apply to them.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use bare asserts and dummy credentials.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── MyPy ──────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jose.*", "slowapi.*", "structlog.*", "redis.*", "aioboto3.*"]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -v --cov=app --cov-report=term-missing"
markers = [
    "integration: marks tests requiring live DB/Redis",
]

[tool.coverage.run]
source = ["app"]
omit = [
    # Seed modules are idempotent demo/dev data loaders. Nothing in the
    # application imports them; they exist to populate a local database.
    # app/core/seed.py was already excluded on that basis — the per-module
    # seeds are the same category and were simply missed.
    "app/core/seed.py",
    "app/modules/*/seed.py",
    "app/modules/*/seed_data.py",
    "alembic/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
