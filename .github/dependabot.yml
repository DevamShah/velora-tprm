# Dependabot keeps the dependency surface of a risk-management platform
# current. Grouped minor/patch updates keep the PR volume manageable; majors
# stay separate so they get read properly.
version: 2

updates:
  # ── Python: monolith backend (pinned via requirements.txt) ──────────────
  - package-ecosystem: pip
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # ── Python: uv workspace (shared lib + 14 services) ─────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, python]
    commit-message:
      prefix: "deps"
    groups:
      workspace-minor-patch:
        update-types: [minor, patch]

  # ── Node: Next.js frontends ─────────────────────────────────────────────
  - package-ecosystem: npm
    directories:
      - /src/frontend
      - /frontend/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: [dependencies, javascript]
    commit-message:
      prefix: "deps"
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  # ── GitHub Actions: keeps the pinned SHAs from going stale ──────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
    groups:
      actions-all:
        patterns: ["*"]

  # ── Docker: 14 service images plus the web image ────────────────────────
  - package-ecosystem: docker
    directories:
      - /frontend/web
      - /services/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    commit-message:
      prefix: "deps"
    groups:
      base-images:
        patterns: ["*"]
