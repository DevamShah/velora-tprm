[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "velora-common"
version = "0.1.0"
description = "Shared utilities for Velora TPRM microservices"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "structlog>=24.0,<25.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0,<5.0",
    "cryptography>=42.0,<44.0",
    "fastapi>=0.110,<1.0",
    "redis>=5.0,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velora_common"]
